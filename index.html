<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Blurb" />
  <title>Blurb — books worth talking about</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css?v=11" />
  <link rel="stylesheet" href="/spoiler-upgrade.css?v=1" />
  <link rel="stylesheet" href="/catalogue-layout-fix.css?v=1" />
  <link rel="stylesheet" href="/feed-action-tweaks.css?v=6" />
  <link rel="stylesheet" href="/create-flow.css?v=2" />
  <link rel="stylesheet" href="/review-card-fit.css?v=2" />
</head>
<body>
  <main id="app" class="app-shell">
    <section id="feedView" class="view view-active" aria-label="Home feed">
      <header class="feed-header glass-header">
        <button id="feedFollowing" class="feed-tab">Following</button>
        <button id="feedForYou" class="feed-tab active">For You</button>
        <button id="openNotifications" class="icon-button header-action" aria-label="Notifications">
          <span class="icon">♡</span><span class="notification-dot" hidden></span>
        </button>
      </header>
      <div id="feed" class="feed"></div>
    </section>

    <section id="discoverView" class="view" aria-label="Discover">
      <div class="page-scroll">
        <header class="page-header">
          <p class="eyebrow">Find your next obsession</p>
          <h1>Discover</h1>
          <div class="search-wrap">
            <span>⌕</span>
            <input id="discoverSearch" type="search" placeholder="Search books or authors" autocomplete="off" />
          </div>
        </header>
        <div class="section-block">
          <div class="section-title-row"><h2>Trending tropes</h2><span>This week</span></div>
          <div id="tropeRail" class="pill-rail"></div>
        </div>
        <div class="section-block">
          <div class="section-title-row"><h2>Books in the Spotlight</h2><span id="bookCount"></span></div>
          <div id="bookGrid" class="book-grid"></div>
        </div>
      </div>
    </section>

    <section id="createView" class="view" aria-label="Create post">
      <div class="page-scroll create-page">
        <header class="page-header compact">
          <p class="eyebrow">Say it in your own words</p>
          <h1>Create a Blurb</h1>
        </header>
        <form id="createForm" class="editor-card">
          <label class="field-label">Book</label>
          <button id="bookPickerButton" type="button" class="picker-button"><span id="selectedBookLabel">Choose a book</span><span>›</span></button>
          <input id="selectedBookId" type="hidden" />

          <label class="field-label">Your rating <span class="optional">optional</span></label>
          <div id="ratingPicker" class="rating-picker" role="radiogroup" aria-label="Rating"></div>
          <input id="ratingValue" type="hidden" />

          <label class="field-label" for="caption">What did you think?</label>
          <textarea id="caption" maxlength="1200" placeholder="The review, the rant, the reason everyone needs to read it..."></textarea>
          <div class="char-count"><span id="captionCount">0</span>/1200</div>

          <label class="field-label" for="mediaFile">Photo or video <span class="optional">optional</span></label>
          <label class="upload-zone" for="mediaFile">
            <input id="mediaFile" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,video/quicktime" />
            <div id="uploadPrompt"><strong>＋ Add media</strong><span>Image or video up to 50 MB</span></div>
            <div id="mediaPreview" class="media-preview" hidden></div>
          </label>

          <label class="field-label" for="tags">Tropes & tags <span class="optional">optional</span></label>
          <input id="tags" class="text-input" placeholder="slow burn, found family, dragons" />

          <label class="toggle-row"><span><strong>Spoiler warning</strong><small>Hide the post until someone chooses to reveal it.</small></span><input id="spoilerToggle" type="checkbox" /><i></i></label>

          <button id="publishButton" class="primary-button" type="submit">Post to Blurb</button>
          <p id="createStatus" class="form-status"></p>
        </form>
      </div>
    </section>

    <section id="libraryView" class="view" aria-label="Library">
      <div class="page-scroll">
        <header class="page-header">
          <p class="eyebrow">Your reading life</p>
          <h1>Library</h1>
          <div id="libraryTabs" class="segmented">
            <button data-library="tbr" class="active">TBR</button>
            <button data-library="reading">Reading</button>
            <button data-library="read">Read</button>
            <button data-library="dnf">DNF</button>
          </div>
        </header>
        <div id="libraryContent" class="library-list"></div>
      </div>
    </section>

    <section id="profileView" class="view" aria-label="Profile">
      <div class="page-scroll">
        <div id="profileContent"></div>
      </div>
    </section>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-view="feed" class="nav-item active" aria-label="Home">
        <span class="nav-art nav-home" aria-hidden="true">
          <svg viewBox="0 0 64 64">

              <linearGradient id="homeIvory" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffefa"/><stop offset="1" stop-color="#f1dfc9"/></linearGradient>
            </defs>

            <path class="ivory-fill" fill="url(#homeIvory)" d="M18 30 32 18l14 12v20H37V35H27v15h-9Z"/>
            <path class="bronze-stroke" d="M7 30.5 32 8l25 22.5M15 32v22h34V32M27 54V35h10v19"/>
            <path class="nav-highlight" d="M12 30 32 12l19 17"/>
          </svg>
        </span>
      </button>

          <svg viewBox="0 0 64 64">
            <defs>
              <linearGradient id="discoverBronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd2a4"/><stop offset=".4" stop-color="#dc8a53"/><stop offset=".76" stop-color="#a65329"/><stop offset="1" stop-color="#713518"/></linearGradient>
              <radialGradient id="discoverIvory"><stop offset="0" stop-color="#fffefa"/><stop offset="1" stop-color="#f0dcc3"/></radialGradient>
            </defs>
            <circle class="nav-shadow-stroke" cx="27" cy="27" r="17"/>
            <circle fill="url(#discoverBronze)" class="bronze-fill" cx="27" cy="27" r="17"/>

            <circle class="bronze-stroke" cx="27" cy="27" r="17"/>
            <circle class="bronze-stroke thin" cx="27" cy="27" r="12"/>
            <path class="bronze-stroke" d="m40 40 14 14"/>

          </svg>
        </span>
      </button>
      <button data-view="create" class="nav-item create-nav" aria-label="Create">
        <span class="nav-art nav-create" aria-hidden="true">
          <svg viewBox="0 0 78 64">
            <defs>
              <linearGradient id="createBronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd2a4"/><stop offset=".36" stop-color="#dc8950"/><stop offset=".74" stop-color="#aa5126"/><stop offset="1" stop-color="#713515"/></linearGradient>
              <linearGradient id="createIvory" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f5eee5"/></linearGradient>
            </defs>
            <path class="nav-shadow-stroke" d="M5 14h8c8 0 16 2 26 10 10-8 18-10 26-10h8v39c-11-1-22 1-34 9C27 54 16 52 5 53Z"/>

            <path fill="url(#createIvory)" class="ivory-fill" d="M10 9c9-.6 18 2 29 11v36C28 49 19 47 10 48Zm58 0c-9-.6-18 2-29 11v36c11-7 20-9 29-8Z"/>
            <path class="bronze-stroke" d="M10 9c9-.6 18 2 29 11v36C28 49 19 47 10 48Zm58 0c-9-.6-18 2-29 11v36c11-7 20-9 29-8Z"/>
            <path class="bronze-stroke thin" d="M39 20v36"/>
            <path fill="url(#createBronze)" class="bronze-fill plus-fill" d="M34 25h10v8h8v10h-8v8H34v-8h-8V33h8Z"/>
            <path class="plus-stroke" d="M34 25h10v8h8v10h-8v8H34v-8h-8V33h8Z"/>
            <path class="nav-highlight" d="M14 13c7 0 14 2 21 7"/>
          </svg>
        </span>
      </button>
      <button data-view="library" class="nav-item" aria-label="Library">
        <span class="nav-art nav-library" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <defs>
              <linearGradient id="libraryBronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd2a4"/><stop offset=".38" stop-color="#dc8950"/><stop offset=".75" stop-color="#a9542a"/><stop offset="1" stop-color="#733719"/></linearGradient>
              <linearGradient id="libraryIvory" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf9"/><stop offset="1" stop-color="#f1dcc2"/></linearGradient>
            </defs>
            <rect class="nav-shadow-stroke" x="6" y="12" width="13" height="42" rx="3"/>
            <rect class="nav-shadow-stroke" x="22" y="8" width="15" height="46" rx="3"/>
            <path class="nav-shadow-stroke" d="m41 14 11-3 8 40-11 3Z"/>

            <rect fill="url(#libraryIvory)" class="ivory-fill" x="25" y="12" width="9" height="38" rx="1.5"/>
            <path fill="url(#libraryBronze)" class="bronze-fill" d="m41 14 11-3 8 40-11 3Z"/>
            <path fill="url(#libraryIvory)" class="ivory-fill" d="m45 17 5-1.3 6.5 32-5 1.3Z"/>

        </span>
      </button>
      <button data-view="profile" class="nav-item" aria-label="Profile">
        <span class="nav-art nav-profile" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <defs>
              <linearGradient id="profileBronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd2a4"/><stop offset=".37" stop-color="#dc8950"/><stop offset=".76" stop-color="#a55228"/><stop offset="1" stop-color="#713517"/></linearGradient>
              <radialGradient id="profileIvory"><stop offset="0" stop-color="#fffefa"/><stop offset="1" stop-color="#f0dcc3"/></radialGradient>
            </defs>
            <circle class="nav-shadow-stroke" cx="32" cy="32" r="24"/>
            <circle fill="url(#profileBronze)" class="bronze-fill" cx="32" cy="32" r="24"/>
            <circle fill="url(#profileIvory)" class="ivory-fill" cx="32" cy="32" r="19"/>
            <circle fill="url(#profileBronze)" class="bronze-fill" cx="32" cy="25" r="7"/>
            <path fill="url(#profileBronze)" class="bronze-fill" d="M18 47c2.4-8 7.2-12 14-12s11.6 4 14 12Z"/>

          </svg>
        </span>
      </button>
    </nav>
  </main>

  <div id="sheetBackdrop" class="sheet-backdrop" hidden></div>

  <section id="authSheet" class="sheet" aria-label="Sign in" hidden>
    <div class="sheet-handle"></div>
    <button class="sheet-close" data-close-sheet aria-label="Close">×</button>
    <p class="eyebrow">Welcome to</p>
    <h2 class="brand-word">Blurb<span>.</span></h2>
    <p class="sheet-copy">Your feed for books, reviews and the people who can’t stop talking about them.</p>
    <div class="auth-mode segmented two"><button id="signInMode" class="active" type="button">Sign in</button><button id="signUpMode" type="button">Create account</button></div>
    <form id="authForm">
      <input id="authEmail" class="text-input" type="email" placeholder="Email" required />
      <input id="authPassword" class="text-input" type="password" minlength="6" placeholder="Password" required />
      <button id="authSubmit" class="primary-button" type="submit">Sign in</button>
      <p id="authStatus" class="form-status"></p>
    </form>
  </section>

  <section id="bookSheet" class="sheet tall" aria-label="Choose a book" hidden>
    <div class="sheet-handle"></div>
    <button class="sheet-close" data-close-sheet aria-label="Close">×</button>
    <h2>Choose a book</h2>
    <input id="bookSheetSearch" class="text-input" type="search" placeholder="Search title or author" />
    <div id="bookSheetList" class="sheet-list"></div>
  </section>

  <section id="commentsSheet" class="sheet tall" aria-label="Comments" hidden>
    <div class="sheet-handle"></div>
    <button class="sheet-close" data-close-sheet aria-label="Close">×</button>
    <h2>Comments</h2>
    <div id="commentsList" class="comments-list"></div>
    <form id="commentForm" class="comment-form">
      <input id="commentInput" class="text-input" maxlength="500" placeholder="Add a comment…" />
      <button type="submit">Post</button>
    </form>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js?v=11"></script>
  <script type="module" src="/spoiler-upgrade.js?v=1"></script>
  <script type="module" src="/catalogue-link.js?v=3"></script>
  <script type="module" src="/cover-inline-fix.js?v=1"></script>
  <script type="module" src="/admin-controls.js?v=1"></script>
  <script type="module" src="/feed-action-tweaks.js?v=4"></script>
  <script type="module" src="/share-menu.js?v=4"></script>
  <script type="module" src="/create-flow.js?v=3"></script>
  <script type="module" src="/review-card-fit.js?v=2"></script>
</body>
</html>
